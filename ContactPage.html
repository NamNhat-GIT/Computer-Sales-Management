<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Computer Sales</title>
    <link rel="stylesheet" href="css.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <div class="brand">Computer Sales Management</div>
        <nav id="siteNav"></nav>
        <a href="index.html" class="navigate-button">Home</a>
        <a href="ProfilePage.html" class="navigate-button">Profile</a>
        <a href="ContactPage.html" class="navigate-button">Contact</a>
        <a href="LoginPage.html" class="navigate-button">Login</a>
        <a href="RegisterPage.html" class="navigate-button">Register</a>
        <a href="MyCartPage.html" class="navigate-button">My Cart</a>
    </header>
    <main>
        <section>
            <h1>Contact Us</h1>
            <p>If you have questions about our computer sales management system, send us a message below.</p>
            <form class="form-grid">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <input type="text" name="subject" placeholder="Subject" required>
                <textarea name="message" rows="5" placeholder="Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        � 2026 Computer Sales Management Systems
    </footer>
</body>
</html>
