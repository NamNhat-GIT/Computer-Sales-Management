<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Computer Sales</title>
    <link rel="stylesheet" href="css/css.css">
    <script src="js/SecurityUtils.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <header>
        <div class="brand">🛒 Computer Sales</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="ProfilePage.html">Profile</a>
            <a href="ContactPage.html">Contact</a>
            <a href="LoginPage.html">Login</a>
            <a href="RegisterPage.html">Register</a>
        </nav>
        <div class="header-right">
            <a href="MyCartPage.html" class="navigate-button" style="position: relative;">
                🛒 Cart
                <span class="cart-counter" id="cartCount" style="display: none;">0</span>
            </a>
        </div>
    </header>
    <main>
        <section>
            <h1>✉️ Contact Us</h1>
            <p>We'd love to hear from you! Send us a message and we'll respond as soon as possible.</p>
        </section>
        <section>
            <form class="form-grid" onsubmit="handleContactForm(event)">
                <input type="text" id="contactName" placeholder="Your Full Name" required>
                <p id="nameError" class="error"></p>

                <input type="email" id="contactEmail" placeholder="Your Email Address" required>
                <p id="emailError" class="error"></p>

                <input type="tel" id="contactPhone" placeholder="Your Phone Number (optional)">
                <p id="phoneError" class="error"></p>

                <input type="text" id="contactSubject" placeholder="Subject" required>
                <p id="subjectError" class="error"></p>

                <textarea id="contactMessage" rows="6" placeholder="Your Message" required></textarea>
                <p id="messageError" class="error"></p>

                <button type="submit" class="primary-btn">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        © 2026 Computer Sales Management Systems | All Rights Reserved
    </footer>
    <script>
        // Update cart counter
        function updateCartCounter() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const count = cart.length;
            const counter = document.getElementById('cartCount');
            if (counter) {
                if (count > 0) {
                    counter.textContent = count;
                    counter.style.display = 'flex';
                } else {
                    counter.style.display = 'none';
                }
            }
        }
        updateCartCounter();

        // Handle contact form submission
        function handleContactForm(event) {
            event.preventDefault();
            
            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const subject = document.getElementById('contactSubject').value.trim();
            const message = document.getElementById('contactMessage').value.trim();

            let isValid = true;

            if (!name || !SecurityUtils.validateFullName(name)) {
                SecurityUtils.showErrorMessage('nameError', 'Please enter a valid name');
                isValid = false;
            }

            if (!email || !SecurityUtils.validateEmail(email)) {
                SecurityUtils.showErrorMessage('emailError', 'Please enter a valid email');
                isValid = false;
            }

            if (!subject) {
                SecurityUtils.showErrorMessage('subjectError', 'Subject is required');
                isValid = false;
            }

            if (!message || message.length < 10) {
                SecurityUtils.showErrorMessage('messageError', 'Message must be at least 10 characters');
                isValid = false;
            }

            if (isValid) {
                let messages = JSON.parse(localStorage.getItem('contactMessages') || '[]');
                messages.push({
                    name: SecurityUtils.sanitizeInput(name),
                    email: SecurityUtils.sanitizeInput(email),
                    subject: SecurityUtils.sanitizeInput(subject),
                    message: SecurityUtils.sanitizeInput(message),
                    timestamp: new Date().toISOString()
                });
                localStorage.setItem('contactMessages', JSON.stringify(messages));
                
                SecurityUtils.showCustomAlert('Thank you for your message! We will get back to you soon.', 'success', 3000);
                document.getElementById('contactForm').reset();
                document.querySelector('form').reset();
            }
        }

        window.handleContactForm = handleContactForm;
    </script>
</body>
</html>
