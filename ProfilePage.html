<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Computer Sales</title>
    <link rel="stylesheet" href="css/css.css">
    <script src="js/ProfilePage.js" defer></script>
</head>
<body>
    <header>
        <div class="brand">🛒 Computer Sales</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="ProfilePage.html">Profile</a>
            <a href="ContactPage.html">Contact</a>
            <a href="LoginPage.html">Login</a>
            <a href="RegisterPage.html">Register</a>
        </nav>
        <div class="header-right">
            <a href="MyCartPage.html" class="navigate-button" style="position: relative;">
                🛒 Cart
                <span class="cart-counter" id="cartCount" style="display: none;">0</span>
            </a>
        </div>
    </header>
    <main>
        <section>
            <h1>User Profile</h1>
            <div class="card">
                <h2>User Details</h2>
                <p><strong>Name:</strong> <span id="userName"></span></p>
                <p><strong>Email:</strong> <span id="userEmail"></span></p>
            </div>
        </section>
    </main>
    <footer>
        © 2026 Computer Sales Management Systems | All Rights Reserved
    </footer>
    <script>
        // Update cart counter
        function updateCartCounter() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const count = cart.length;
            const counter = document.getElementById('cartCount');
            if (counter) {
                if (count > 0) {
                    counter.textContent = count;
                    counter.style.display = 'flex';
                } else {
                    counter.style.display = 'none';
                }
            }
        }
        updateCartCounter();
    </script>
</body>
</html>
