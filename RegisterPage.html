<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Computer Sales</title>
    <link rel="stylesheet" href="css/css.css">
    <script src="js/SecurityUtils.js" defer></script>
    <script src="js/Register.js" defer></script>
</head>
<body>
    <header>
        <div class="brand">
            <img src="Image/TechCart.jpg" alt="TechCart Logo" class="logo">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="ProfilePage.html">Profile</a>
            <a href="ContactPage.html">Contact</a>
            <a href="LoginPage.html">Login</a>
            <a href="RegisterPage.html">Register</a>
        </nav>
        <div class="header-right">
            <a href="MyCartPage.html" class="navigate-button" style="position: relative;">
                🛒 Cart
                <span class="cart-counter" id="cartCount" style="display: none;">0</span>
            </a>
        </div>
    </header>
    <main>
        <section>
            <h1>Create an Account</h1>
            <p>Join us to start shopping and manage your cart</p>
            <form class="form-grid">
                <input id="fullName" type="text" placeholder="Full Name" required>
                <p id="NameError" class="error"></p>

                <input id="email" type="email" placeholder="Email Address" required>
                <p id="EmailError" class="error"></p>

                <input id="password" type="password" placeholder="Password (min 8 chars, uppercase, lowercase, number, special char)" required>
                <p id="PasswordError" class="error"></p>

                <input id="confirmPassword" type="password" placeholder="Confirm Password" required>
                <p id="ConfirmPasswordError" class="error"></p>

                <button type="button" class="primary-btn" onclick="RegisterButton()">Create Account</button>
                <p style="text-align: center; margin-top: 1rem;">
                    Already have an account? <a href="LoginPage.html" style="color: #0f4971; font-weight: bold;">Login here</a>
                </p>
            </form>
        </section>
    </main>
    <footer>
        © 2026 Computer Sales Management Systems | All Rights Reserved
    </footer>
</body>
</html>
